server:
  port: 8080
  servlet:
    context-path: /
    # Admin UI idle session for embedded Tomcat and the native image.
    # A WAR on external Tomcat uses WEB-INF/web.xml instead.
    session:
      timeout: 10m

spring:
  application:
    name: proxy
  datasource:
    # Native images always use SQLite at {data-dir}/proxy.db and ignore url.
    # Any other build uses spring.datasource.url when it is set, including jdbc:sqlite.
    # With no URL, the SQLite file is {data-dir}/proxy.db.
    # WAR on Tomcat: the driver is in Tomcat lib, not inside the WAR.
    # Executable JAR: PostgreSQL, SQL Server and Oracle drivers are inside the JAR.
    # The driver class is taken from the URL. Set driver-class-name only to override that.
    # jndi-name: java:comp/env/jdbc/proxy
    # url: jdbc:postgresql://localhost:5432/proxy
    # username: proxy
    # password: secret
    hikari:
      # Applied to the SQLite pool and to a JDBC URL pool. JNDI uses the Tomcat Resource pool.
      maximum-pool-size: 4
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    # Optional. When unset, Hibernate resolves the dialect from JDBC metadata.
    # Boot 2: org.hibernate.dialect.PostgreSQL10Dialect, SQLServer2012Dialect, Oracle12cDialect
    # Boot 3: org.hibernate.dialect.PostgreSQLDialect, SQLServerDialect, OracleDialect
    # database-platform:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        cache:
          use_second_level_cache: true
          use_query_cache: true
          region:
            factory_class: io.github.connellite.proxy.config.ReferenceJCacheRegionFactory
        javax:
          cache:
            provider: com.github.benmanes.caffeine.jcache.spi.CaffeineCachingProvider
            # Hibernate creates regions (entities, query, update-timestamps) at startup.
            missing_cache_strategy: create
      "[javax.persistence.sharedCache.mode]": ENABLE_SELECTIVE
      "[jakarta.persistence.sharedCache.mode]": ENABLE_SELECTIVE
  thymeleaf:
    cache: false

proxy:
  # Optional data directory (contains proxy.db). When omitted:
  # Tomcat WAR → ${catalina.base}/data, JAR → ${user.dir}/data, else ./data
  # data-dir: ./data
  bootstrap:
    admin-username: admin
    admin-password: admin
  http:
    enabled: false
    bind-host: 0.0.0.0
    port: 3128
  https:
    enabled: false
    bind-host: 0.0.0.0
    port: 3129
  tls:
    # Optional bootstrap defaults; configure certificates in the Encryption UI.
    server-name:
    certificate-path:
    private-key-path:
  socks5:
    enabled: false
    bind-host: 0.0.0.0
    port: 1080
  ssh:
    enabled: false
    bind-host: 0.0.0.0
    port: 2222
    # Host key types, one file each in data-dir: ssh-ed25519, ecdsa-sha2-nistp256/384/521, ssh-rsa.
    # ecdsa-sha2-nistp521 keeps ssh-hostkey.ser from earlier versions.
    host-keys: ssh-ed25519, ecdsa-sha2-nistp521, ssh-rsa
  http-auth-required: false
  https-auth-required: false
  socks-auth-required: false
  socks-udp-enabled: false
  connect-timeout-ms: 15000
  # Outbound IP TTL (0 = OS default). Prefer the Upstream page; applies to proxy→direct/upstream sockets.
  outbound-ttl: 0
  # Cut the first TLS handshake record to an HTTP/HTTPS/SOCKS5 upstream in two.
  # Modes: FIXED, BEFORE_SNI, AFTER_SNI, MIDDLE_SNI, RANDOM_SNI. Position (1–1500) is used by FIXED.
  client-hello-split-enabled: false
  client-hello-split-mode: FIXED
  client-hello-split-position: 1
  # Extra space, hoSt, no space after the colon and mixed-case Host in plain HTTP to an upstream.
  http-header-mangle-enabled: false
  idle-timeout-seconds: 300
  # SSH server asks the client this many times per idle window.
  ssh-keepalive-enabled: true
  ssh-keepalive-count: 5
  http-max-content-length-bytes: 8388608
  # IANA timezone for UI dates / expire-on (examples: UTC, America/New_York)
  # timezone: UTC

logging:
  level:
    root: INFO
    io.github.connellite.proxy: INFO
    # SSHD local-forward race can WARN/NPE while the tunnel still works (SSHD-849/961).
    org.apache.sshd.common.forward.DefaultForwarder: ERROR
    # fix: Invalid character found in method name [...]. HTTP method names must be tokens
    org.apache.coyote.http11.Http11Processor: WARN
