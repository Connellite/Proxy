outboundTtlHint=0 = OS default. 1–255 overrides TTL on sockets this proxy opens to the internet or an upstream (ZeroOmega → this proxy → direct/upstream). Useful when the proxy runs on the same PC (e.g. tethering). Takes effect on new outbound connections after Save.
clientHelloSplit=Split ClientHello
clientHelloSplitHint=Cuts the first TLS handshake record into two records on new connections to an HTTP, HTTPS or SOCKS5 upstream. With HTTPS the cut is in this proxy''s ClientHello to the upstream (SNI of the upstream host). With HTTP and SOCKS5 it is in the site''s first ClientHello after the upstream handshake. Direct and SSH are not affected.
clientHelloSplitMode=Split point
clientHelloSplitPosition=Split position in bytes
clientHelloSplitPositionHint=1–1500. Used by the fixed position mode. If the record is shorter, it is sent whole.
splitFixed=Fixed position
splitBeforeSni=Before SNI
splitAfterSni=After SNI
splitMiddleSni=Middle of SNI
splitRandomSni=Random point inside SNI
httpHeaderMangle=HTTP space juggling
httpHeaderMangleHint=Plain HTTP this proxy writes through an HTTP or SOCKS5 upstream (CONNECT to an HTTP upstream and requests to http:// sites): extra space after the method, Host becomes hoSt, no space after the colon, mixed-case host. HTTP a client sends inside its own tunnel is not changed. Some servers reject such requests. With an HTTPS upstream these bytes are encrypted and nothing changes.
