title=DNS Relay
hint=DNS on the device points here. A relay name returns this server''s address and the TCP relay connects by SNI. An address name returns that IP and is not accepted by the relay. TLS is not decrypted. Saving replaces the working snapshot; open connections keep the old target.
listeners=Listeners
thisServer=This server
advertised=IP for relay names
advertisedHint=DNS answers a relay name with this IP, so the device connects here instead of the real server. One IPv4 or IPv6. A relay route cannot be saved until this is set.
resolver=Resolver for everything else
resolverHint=IP, host:port, https://…, tls://…, h3://… or quic://…. Names that are not in the route table are forwarded there. A relay upstream host is resolved there too, so it does not point back at this server.
dns=DNS
enableDns=Enable DNS
dnsBind=DNS bind address
dnsPort=DNS port
dnsHint=Anyone who can reach this port can query other names through it.
doh=DNS over HTTPS
enableDoh=Enable DoH
dohBind=DoH bind address
dohPort=DoH port
dohHint=GET and POST /dns-query. Uses the certificate from Encryption. Cannot share an address and port with the TCP relay.
doh3=DNS over HTTP/3
enableDoh3=Enable DoH3
doh3Bind=DoH3 bind address
doh3Port=DoH3 port
doh3Hint=GET and POST /dns-query over HTTP/3. UDP, so port 443 can be used beside the TCP relay. Uses the certificate from Encryption. Cannot share an address and port with DoQ.
dot=DNS over TLS
enableDot=Enable DoT
dotBind=DoT bind address
dotPort=DoT port
dotHint=TLS on TCP, then the same DNS messages as plain DNS. Uses the certificate from Encryption. Cannot share an address and port with DoH or the TCP relay.
doq=DNS over QUIC
enableDoq=Enable DoQ
doqBind=DoQ bind address
doqPort=DoQ port
doqHint=QUIC on UDP. Uses the same certificate. If the native QUIC library is missing, only this listener stays down.
tcp=TCP relay
enableTcp=Enable TCP relay
tcpUseUpstream=Use the selected upstream proxy
tcpBind=TCP bind address
tcpPort=TCP port
tcpHint=Reads the name from ClientHello and copies the bytes unchanged. An empty upstream host is looked up through the resolver above.
saveListeners=Save listeners
routes=Routes
routeName=Name
routeNameHint=Hostname or *.example.com. One row is one name.
mode=Mode
upstreamHost=Upstream host
upstreamHostHint=Empty uses the real address of the name the client opened. Host only, not host:port.
upstreamPort=Upstream port
upstreamPortHint=Empty uses the port the client opened.
answerIp=Answer IP
answerIpHint=One IPv4 or IPv6.
saveRoute=Save route
routeHint=Click a row to fill the form. Save updates that route.
recentQueries=Recent queries
recentTcp=Recent TCP connections
allowedNetworks=Allowed networks
allowedNetworksHint=Empty allows every address. One IP or CIDR, for example 203.0.113.0/24.
