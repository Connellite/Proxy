server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: proxy
  datasource:
    # Native images always use SQLite at {data-dir}/proxy.db and ignore url.
    # Any other build uses spring.datasource.url when it is set, including jdbc:sqlite.
    # With no URL, the SQLite file is {data-dir}/proxy.db.
    # WAR on Tomcat: the driver is in Tomcat lib, not inside the WAR.
    # Executable JAR: PostgreSQL, SQL Server and Oracle drivers are inside the JAR.
    # The driver class is taken from the URL. Set driver-class-name only to override that.
    # jndi-name: java:comp/env/jdbc/proxy
    # url: jdbc:postgresql://localhost:5432/proxy
    # username: proxy
    # password: secret
    hikari:
      # Applied to the SQLite pool and to a JDBC URL pool. JNDI uses the Tomcat Resource pool.
      maximum-pool-size: 4
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    # Optional. When unset, Hibernate resolves the dialect from JDBC metadata.
    # Boot 2: org.hibernate.dialect.PostgreSQL10Dialect, SQLServer2012Dialect, Oracle12cDialect
    # Boot 3: org.hibernate.dialect.PostgreSQLDialect, SQLServerDialect, OracleDialect
    # database-platform:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  thymeleaf:
    cache: false

proxy:
  # Optional data directory (contains proxy.db). When omitted:
  # Tomcat WAR → ${catalina.base}/data, JAR → ${user.dir}/data, else ./data
  # data-dir: ./data
  bootstrap:
    admin-username: admin
    admin-password: admin
  http:
    enabled: false
    bind-host: 0.0.0.0
    port: 3128
  https:
    enabled: false
    bind-host: 0.0.0.0
    port: 3129
  tls:
    # Optional bootstrap defaults; configure certificates in the Encryption UI.
    server-name:
    certificate-path:
    private-key-path:
  socks5:
    enabled: false
    bind-host: 0.0.0.0
    port: 1080
  ssh:
    enabled: false
    bind-host: 0.0.0.0
    port: 2222
  http-auth-required: false
  socks-auth-required: false
  socks-udp-enabled: false
  connect-timeout-ms: 15000
  # Outbound IP TTL (0 = OS default). Prefer Settings UI; applies to proxy→direct/upstream sockets.
  outbound-ttl: 0
  idle-timeout-seconds: 300
  http-max-content-length-bytes: 8388608
  # IANA timezone for UI dates / expire-on (examples: UTC, America/New_York)
  # timezone: UTC

logging:
  level:
    root: INFO
    io.github.connellite.proxy: INFO
    # SSHD local-forward race can WARN/NPE while the tunnel still works (SSHD-849/961).
    org.apache.sshd.common.forward.DefaultForwarder: ERROR
