zeroOmegaHttp=HTTP → protocol <code>HTTP</code>, port <strong>{0}</strong>.
zeroOmegaHttps=HTTPS → protocol <code>HTTPS</code>, port <strong>{0}</strong> (enable in Settings; self-signed cert).
zeroOmegaSocks=SOCKS5 / SOCKS4 → same host, port <strong>{0}</strong>. SOCKS4 only when SOCKS auth is <em>off</em>. Chrome often lacks SOCKS password auth.
zeroOmegaSsh=SSH tunnels → host + port <strong>{0}</strong> (enable in Settings). Password or a key from the user SSH page. Use PuTTY/OpenSSH local/remote port forward; shell is disabled.
