# Caffeine JCache defaults. The copy inside caffeine-jcache is not visible to a GraalVM
# native image, and Typesafe Config then fails with: No configuration setting found for key 'caffeine'.

caffeine.jcache {
  default {
    key-type = java.lang.Object
    value-type = java.lang.Object

    store-by-value {
      # Hibernate already disassembles entities. Instantiating JavaSerializationCopier fails
      # in a native image, and store-by-value is not used.
      enabled = false
      strategy = null
    }

    executor = null
    scheduler = null
    listeners = []

    read-through {
      enabled = false
      loader = null
    }

    write-through {
      enabled = false
      writer = null
    }

    monitoring {
      native-statistics = false
      statistics = false
      management = false
    }

    policy {
      lazy-expiration {
        creation = "eternal"
        update = "eternal"
        access = "eternal"
      }

      eager-expiration {
        after-write = null
        after-access = null
        variable = null
      }

      refresh {
        after-write = null
      }

      maximum {
        size = null
        weight = null
        weigher = null
      }
    }
  }
}
