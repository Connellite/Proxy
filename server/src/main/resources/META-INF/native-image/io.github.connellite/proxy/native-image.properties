Args = --add-opens=java.base/java.lang=ALL-UNNAMED \
       --add-opens=java.base/java.util=ALL-UNNAMED \
       --add-opens=java.base/sun.nio.ch=ALL-UNNAMED \
       --initialize-at-run-time=java.awt,sun.awt,sun.java2d,sun.font,sun.swing,org.apache.sshd.common.digest.BuiltinDigests,org.bouncycastle.jcajce.provider.drbg \
       -H:+UnlockExperimentalVMOptions \
       -H:-AddAllFileSystemProviders \
       --features=io.github.connellite.proxy.config.feature.BouncyCastleFeature \
       --initialize-at-build-time=org.bouncycastle
